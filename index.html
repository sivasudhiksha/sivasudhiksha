<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            border: 2px solid #667eea;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .search-box button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .search-box button:hover {
            background: #764ba2;
        }
        
        .weather-info {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: none;
        }
        
        .weather-info.active {
            display: block;
        }
        
        .temp {
            font-size: 3em;
            color: #667eea;
            margin: 20px 0;
        }
        
        .location {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Prediction</h1>
            <p>Get accurate weather forecasts for any location</p>
        </header>
        
        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
            >
            <button onclick="searchWeather()">Search Weather</button>
        </div>
        
        <div class="weather-info" id="weatherInfo">
            <div class="location" id="location"></div>
            <div class="temp" id="temperature"></div>
            <p id="description"></p>
        </div>
    </div>
    
    <script>
        function searchWeather() {
            const city = document.getElementById('cityInput').value;
            if (city.trim() === '') {
                alert('Please enter a city name');
                return;
            }
            
            // Display sample data (integrate real API here)
            document.getElementById('location').textContent = city;
            document.getElementById('temperature').textContent = '25°C';
            document.getElementById('description').textContent = 'Partly Cloudy';
            document.getElementById('weatherInfo').classList.add('active');
        }
    </script>
</body>
</html>
